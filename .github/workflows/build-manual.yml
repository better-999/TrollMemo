name: Build IPA (Manual)

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: 'Build scheme (rootless / roothide / default)'
        required: true
        default: 'default'
        type: choice
        options:
          - default
          - rootless
          - roothide

env:
  THEOS: ''
  XCODE_VERSION: '15.4'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build TrollMemo .tipa
    runs-on: macos-14

    steps:
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Homebrew dependencies
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 \
            brew install dpkg make libplist openssl@3 ldid-procursus zip
          echo "/usr/local/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Checkout XXTouchNG/theos
        uses: actions/checkout@v4
        with:
          repository: XXTouchNG/theos
          ref: 954dfd17fd05544a3bb26b2a25e1930cd228f4ef
          path: theos
          submodules: recursive

      - name: Set THEOS env & prepare SDKs
        run: |
          rm -rf $GITHUB_WORKSPACE/theos/sdks
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: Checkout theos/sdks
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          ref: master
          path: ${{ env.THEOS }}/sdks

      - name: Detect SDK version for Makefile
        run: |
          echo "Available SDKs:"
          ls -la "$THEOS/sdks/" || true
          # 优先使用 iPhoneOS 15.6 SDK，与设备系统版本对齐
          PREFERRED_SDK=15.6
          if [ -d "$THEOS/sdks/iPhoneOS${PREFERRED_SDK}.sdk" ]; then
            SDK_VERSION=$PREFERRED_SDK
          else
            SDK_VERSION=$(ls "$THEOS/sdks" | sed -n 's/iPhoneOS\([0-9.]*\)\.sdk/\1/p' | sort -V | tail -1)
          fi
          if [ -z "$SDK_VERSION" ]; then
            echo "ERROR: No iPhoneOS SDK found under $THEOS/sdks"
            exit 1
          fi
          echo "Using SDK_VERSION=$SDK_VERSION"
          echo "SDK_VERSION=$SDK_VERSION" >> $GITHUB_ENV

      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: project
          submodules: recursive
          fetch-depth: 0

      - name: Build package
        run: |
          cd $GITHUB_WORKSPACE/project
          
          echo "=== Build Environment ==="
          echo "Current directory: $(pwd)"
          echo "THEOS path: $THEOS"
          echo "SDK_VERSION: $SDK_VERSION"
          test -d "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk" || {
            echo "ERROR: SDK not found: $THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"
            ls -la "$THEOS/sdks/"
            exit 1
          }
          echo "======================="
          
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          ./gen-control.sh "$APP_VERSION"

          SCHEME="${{ github.event.inputs.scheme }}"
          echo "Building with scheme: $SCHEME"
          
          set -o pipefail
          if [ "$SCHEME" = "roothide" ]; then
            THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 make SDK_VERSION="$SDK_VERSION" clean package 2>&1 | tee build.log
          elif [ "$SCHEME" = "rootless" ]; then
            THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 make SDK_VERSION="$SDK_VERSION" clean package 2>&1 | tee build.log
          else
            FINALPACKAGE=1 make SDK_VERSION="$SDK_VERSION" clean package 2>&1 | tee build.log
          fi
          
          echo "=== Build Log (last 100 lines) ==="
          tail -100 build.log
          echo "==================================="
          
          if grep -qiE '(^|[^a-z])error:' build.log; then
            echo "=== Build errors found in log ==="
            grep -iE '(^|[^a-z])error:' build.log | head -20
            exit 1
          fi
          
          if ! ls packages/*.tipa 1>/dev/null 2>&1; then
            echo "ERROR: No .tipa file produced in packages/"
            exit 1
          fi
          
          echo "=== Build Complete ==="
          ls -la packages/*.tipa

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TrollMemo_${{ env.APP_VERSION }}_${{ github.event.inputs.scheme }}
          path: project/packages/*.tipa
          if-no-files-found: error